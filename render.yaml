services:
  - type: web
    name: zgrzyt-api
    runtime: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan config:clear
      php artisan route:clear
      php artisan migrate --force
    startCommand: vendor/bin/heroku-php-apache2 public/
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false

  - type: web
    name: zgrzyt-websockets
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan reverb:start --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
